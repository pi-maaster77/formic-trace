[package]
name = "formic-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "registry"] }
tracing-appender = "0.2"
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.8+spec-1.1.0"
x509-parser = { version = "0.18.1", features = ["verify"] }
nickel-lang = "=2.2.0"
ctrlc = "3.4"
windows-features = { path = "../../libs/windows-features" }

[target.'cfg(windows)'.dependencies]
schannel = "=0.1.30"
winreg = "0.56.0"
