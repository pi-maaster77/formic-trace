[package]
name = "formic-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "registry"] }
tracing-appender = "0.2"
anyhow = "1.0"
chrono = "0.4"
schannel = "=0.1.29"
clap = { version = "4.0", features = ["derive"] }
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x509-parser = { version = "0.16", features = ["verify"] }
nickel-lang = "=2.2.0"