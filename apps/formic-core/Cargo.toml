[package]
name = "formic-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# Librería compartida del espacio de trabajo
formic-common = { path = "../../libs/formic-common" }

# Monitoreo de archivos en Safe Rust (reemplaza a windows-sys)
notify = "6.1"
sysinfo = "0.30"
winreg = "0.52"
netstat2 = "0.9"

# Serialización y deserialización de datos / reglas (formic.json)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Registry"] }

# (Opcional recomendado) Si decides mantener referencias nativas puntuales 
# para funcionalidades específicas de Windows fuera del monitor:
# [dependencies.windows-sys]
# version = "0.52.0"
# features = [
#     "Win32_Foundation",
#     "Win32_Security",
# ]